name: release

# Push a tag like v0.1.0 to build r3dsims + r3dlive for Linux, macOS (Apple silicon) and Windows,
# attach the archives and SHA256SUMS to a GitHub release. scripts/install.sh installs from it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev \
            libxi-dev libxrandr-dev libvulkan-dev pkg-config
      - name: Build
        run: cargo build --release --workspace --locked
      - name: Package
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME:-dev}"
          name="r3dsims-${tag}-${{ matrix.target }}"
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          mkdir -p "dist/$name/bin" "dist/$name/skills"
          cp "target/release/r3dsims$ext" "target/release/r3dlive$ext" "dist/$name/bin/"
          for d in .claude/skills/r3dsims*; do cp -R "$d" "dist/$name/skills/"; done
          cp -R docs README.md LICENSE "dist/$name/"
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
