<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>r3dsims test panel</title>
<style>
  :root { --bg:#14161a; --card:#1d2026; --line:#2c313a; --fg:#e6e8eb; --mute:#8b93a1; --acc:#f2a31b; --a:#f2a31b; --b:#4a86d8; --ok:#4cc38a; --bad:#ef5b5b; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px/1.4 system-ui,sans-serif; }
  #app { display:flex; height:100%; }
  #view { flex:1; min-width:0; background:#000; display:flex; align-items:center; justify-content:center; }
  #view img { max-width:100%; max-height:100%; object-fit:contain; }
  #side { width:400px; max-width:46vw; overflow-y:auto; padding:10px; border-left:1px solid var(--line); }
  h2 { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--mute); margin:14px 0 6px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px; }
  .row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  button { background:#262b33; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 9px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--acc); }
  button:active { transform:translateY(1px); }
  button.go { background:#25402f; border-color:#2f5d41; }
  button.stop { background:#432526; border-color:#6a3335; }
  button.gift { text-align:left; flex:1 1 46%; }
  button.gift small { color:var(--mute); display:block; }
  input,select { background:#101216; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:5px 7px; font:inherit; }
  input[type=text] { width:120px; } input[type=number] { width:64px; }
  .chip { background:#101216; border:1px solid var(--line); border-radius:99px; padding:2px 9px; color:var(--mute); }
  .chip b { color:var(--fg); font-weight:600; }
  .bar { height:8px; background:#101216; border-radius:4px; overflow:hidden; margin:3px 0; }
  .bar i { display:block; height:100%; }
  .side { margin-bottom:6px; }
  .side .name { display:flex; justify-content:space-between; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  td,th { padding:3px 4px; border-bottom:1px solid var(--line); text-align:left; }
  th { color:var(--mute); font-weight:500; }
  tr.cur td { color:var(--acc); }
  #log { height:130px; overflow:auto; font:12px/1.35 ui-monospace,monospace; color:var(--mute); }
  #log .bad { color:var(--bad); } #log .ok { color:var(--ok); }
  .hint { color:var(--mute); font-size:12px; }
  @media (max-width:800px) { #app { flex-direction:column; } #side { width:auto; max-width:none; height:55%; border-left:0; border-top:1px solid var(--line); } }
</style>
<div id="app">
  <div id="view"><img id="pic" src="/stream.mjpg" alt="stream"></div>
  <div id="side">
    <div class="row" id="chips"></div>

    <h2>Skor</h2>
    <div class="card" id="score"></div>

    <h2>Pengirim</h2>
    <div class="card row">
      <label>nama <input id="user" type="text" value="Tester"></label>
      <label>jumlah <input id="count" type="number" min="1" value="1"></label>
      <label>kubu <select id="sideSel"><option value="">otomatis</option></select></label>
    </div>

    <h2>Gift</h2>
    <div class="row" id="gifts"></div>

    <h2>Event lain</h2>
    <div class="card row">
      <button data-ev="like">like x10</button>
      <button data-ev="follow">follow</button>
      <button data-ev="share">share</button>
      <button data-ev="join">join</button>
      <button data-ev="subscribe">subscribe</button>
      <input id="comment" type="text" style="flex:1;min-width:120px" placeholder="komentar...">
      <button id="sendComment">kirim</button>
    </div>

    <h2>Jalankan langsung (aksi / makro)</h2>
    <div class="card row">
      <select id="runName" style="flex:1;min-width:140px"></select>
      <select id="runSide" style="min-width:110px"></select>
      <button id="run">jalankan</button>
    </div>
    <div class="hint">Perlu ronde yang sedang berjalan. Untuk menguji tanpa gift sungguhan.</div>

    <h2>Match</h2>
    <div class="card row">
      <button class="go" data-ctl="start">start</button>
      <button data-ctl="pause">pause</button>
      <button data-ctl="resume">resume</button>
      <button data-ctl="next_round">ronde berikut</button>
      <button class="stop" data-ctl="reset">reset</button>
      <button class="stop" data-ctl="stop">stop</button>
    </div>

    <h2>Biome</h2>
    <div class="card row" id="biomes"></div>

    <h2>Simulasi penonton</h2>
    <div class="card row">
      <label><input id="sim" type="checkbox"> kirim event acak</label>
      <label>tiap <input id="simEvery" type="number" min="0.3" step="0.1" value="1.5"> detik</label>
    </div>

    <h2>Riwayat sesi (menang / kalah)</h2>
    <div class="card" id="history">memuat...</div>

    <h2>Log</h2>
    <div class="card" id="log"></div>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const token = new URLSearchParams(location.search).get('token');
const headers = { 'Content-Type': 'application/json' };
if (token) headers['X-Token'] = token;
let hooks = { triggers: [], actions: {}, macros: {}, biomes: [] };
let hooksSig = '';
let sideKeys = [];

function log(text, cls) {
  const d = document.createElement('div');
  if (cls) d.className = cls;
  d.textContent = new Date().toLocaleTimeString() + '  ' + text;
  const box = $('log');
  box.appendChild(d);
  while (box.children.length > 80) box.removeChild(box.firstChild);
  box.scrollTop = box.scrollHeight;
}

async function post(path, body, label) {
  try {
    const r = await fetch(path, { method: 'POST', headers, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    let note = '';
    if (j.results) note = j.results.map((x) => (x.matched || []).join(', ') || (x.duplicate ? 'duplikat' : 'tidak ada trigger')).join(' | ');
    else if (j.error) note = j.error;
    else if (j.phase) note = 'fase ' + j.phase;
    log(label + (note ? ' -> ' + note : ''), r.ok ? 'ok' : 'bad');
    return j;
  } catch (e) {
    log(label + ' gagal: ' + e, 'bad');
  }
}

function eventBase() {
  const ev = { user: $('user').value || 'Tester', count: Math.max(1, +$('count').value || 1) };
  if ($('sideSel').value) ev.side = $('sideSel').value;
  return ev;
}
const sendGift = (gift, extra) => post('/webhook', { type: 'gift', gift, diamonds: 1, ...eventBase(), ...extra }, 'gift ' + gift + ' x' + eventBase().count);
const sendEvent = (type, extra) => post('/webhook', { type, ...eventBase(), ...extra }, type);
const control = (op) => post('/control', { op }, 'kontrol ' + op);

function giftName(t) {
  const on = Array.isArray(t.on) ? t.on : [t.on];
  for (const p of on) {
    const m = /^gift:(.+)$/i.exec(String(p));
    if (m && !m[1].includes('*')) return m[1];
  }
  return null;
}

function buildStatic() {
  const gifts = $('gifts');
  gifts.textContent = '';
  const seen = new Set();
  for (const t of hooks.triggers || []) {
    const g = giftName(t);
    if (!g || seen.has(g)) continue;
    seen.add(g);
    const b = document.createElement('button');
    b.className = 'gift';
    b.textContent = t.label || t.name || g;
    const s = document.createElement('small');
    s.textContent = 'gift ' + g + (t.cooldown ? ' · cooldown ' + t.cooldown + 's' : '');
    b.appendChild(s);
    b.onclick = () => sendGift(g);
    gifts.appendChild(b);
  }
  if (!seen.size) gifts.textContent = 'belum ada trigger gift';

  const names = [...Object.keys(hooks.macros || {}).map((n) => 'makro: ' + n), ...Object.keys(hooks.actions || {}).map((n) => 'aksi: ' + n)];
  const sel = $('runName');
  sel.textContent = '';
  for (const n of names) {
    const o = document.createElement('option');
    o.value = n.split(': ')[1];
    o.textContent = n;
    sel.appendChild(o);
  }

  const bio = $('biomes');
  bio.textContent = '';
  for (const k of hooks.biomes || []) {
    const b = document.createElement('button');
    b.textContent = k;
    b.onclick = () => control('biome:' + k);
    bio.appendChild(b);
  }
  if (!(hooks.biomes || []).length) bio.textContent = 'tidak ada biome';
}

function fillSides(keys, names) {
  if (keys.join() === sideKeys.join()) return;
  sideKeys = keys;
  for (const id of ['sideSel', 'runSide']) {
    const s = $(id);
    const keep = s.value;
    s.textContent = '';
    if (id === 'sideSel') {
      const o = document.createElement('option');
      o.value = '';
      o.textContent = 'otomatis';
      s.appendChild(o);
    }
    for (const k of keys) {
      const o = document.createElement('option');
      o.value = k;
      o.textContent = k + ' · ' + (names[k] || '');
      s.appendChild(o);
    }
    s.value = keep;
  }
}

function chip(label, value) {
  const c = document.createElement('span');
  c.className = 'chip';
  c.append(label + ' ');
  const b = document.createElement('b');
  b.textContent = value;
  c.appendChild(b);
  return c;
}

let colors = {};
function renderState(st) {
  const keys = Object.keys(st.sides || {});
  fillSides(keys, Object.fromEntries(keys.map((k) => [k, st.sides[k].name])));
  const chips = $('chips');
  chips.textContent = '';
  chips.append(
    chip('fase', st.phase + (st.paused ? ' (pause)' : '')),
    chip('ronde', st.round + '/' + (st.mode === 'endless' ? '∞' : st.rounds)),
    chip('sisa', (st.round_secs_left || 0) + 's'),
    chip('biome', st.biome || '-'),
    chip('fps', st.perf && st.perf.fps ? st.perf.fps : '-'),
  );
  if (st.cinematic) chips.append(chip('kamera', 'ultimate'));
  if (st.autopilot) chips.append(chip('mode', 'autopilot'));

  const score = $('score');
  score.textContent = '';
  keys.forEach((k, i) => {
    const s = st.sides[k];
    const sess = (st.session && st.session.sides && st.session.sides[k]) || { wins: 0, losses: 0 };
    const col = i === 0 ? 'var(--a)' : 'var(--b)';
    const wrap = document.createElement('div');
    wrap.className = 'side';
    const nm = document.createElement('div');
    nm.className = 'name';
    const l = document.createElement('b');
    l.textContent = s.name;
    l.style.color = col;
    const r = document.createElement('span');
    r.textContent = 'HP ' + s.hp + ' · pasukan ' + s.units + ' · babak ini ' + s.round_wins + ' menang';
    nm.append(l, r);
    const bar = document.createElement('div');
    bar.className = 'bar';
    const fill = document.createElement('i');
    fill.style.width = Math.max(0, Math.min(100, (100 * s.hp) / s.max_hp)) + '%';
    fill.style.background = col;
    bar.appendChild(fill);
    const ses = document.createElement('div');
    ses.className = 'hint';
    ses.textContent = 'sesi ini: ' + sess.wins + ' menang, ' + sess.losses + ' kalah';
    wrap.append(nm, bar, ses);
    score.appendChild(wrap);
  });
  if (st.session) {
    const d = document.createElement('div');
    d.className = 'hint';
    d.textContent = 'sesi ini: ' + st.session.rounds + ' babak, ' + st.session.draws + ' seri, ' + st.session.matches + ' match · berjalan ' + Math.round((st.session.secs || 0) / 60) + ' mnt';
    score.appendChild(d);
  }
}

function td(text) {
  const c = document.createElement('td');
  c.textContent = text;
  return c;
}

function renderHistory(h) {
  const box = $('history');
  box.textContent = '';
  if (h.enabled === false) {
    box.textContent = 'riwayat mati (live dijalankan dengan --no-history)';
    return;
  }
  const t = document.createElement('table');
  const head = document.createElement('tr');
  for (const x of ['mulai', 'mnt', 'babak', 'skor (M-K)', 'hasil']) {
    const c = document.createElement('th');
    c.textContent = x;
    head.appendChild(c);
  }
  t.appendChild(head);
  for (const s of (h.sessions || []).slice(0, 8)) {
    const tr = document.createElement('tr');
    if (s.current) tr.className = 'cur';
    const sides = Object.values(s.sides || {});
    const res = s.result === 'draw' ? 'seri' : s.result ? (s.sides[s.result] || {}).name : '-';
    tr.append(
      td(new Date(s.started_unix * 1000).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' }) + (s.current ? ' •' : '')),
      td(Math.round(s.secs / 60)),
      td(s.rounds),
      td(sides.map((x) => x.name + ' ' + x.wins + '-' + x.losses).join(' | ')),
      td(res),
    );
    t.appendChild(tr);
  }
  box.appendChild(t);
  const tot = h.totals || {};
  const d = document.createElement('div');
  d.className = 'hint';
  d.style.marginTop = '6px';
  d.textContent = 'total ' + (tot.sessions || 0) + ' sesi, ' + (tot.rounds || 0) + ' babak, ' + (tot.draws || 0) + ' seri';
  box.appendChild(d);
  for (const [name, v] of Object.entries(tot.by_side || {})) {
    const e = document.createElement('div');
    e.textContent = name + ': ' + v.wins + ' menang, ' + v.losses + ' kalah (babak) · sesi menang ' + v.sessions_won + ', kalah ' + v.sessions_lost;
    box.appendChild(e);
  }
}

async function poll() {
  try {
    renderState(await (await fetch('/state')).json());
  } catch (e) { /* server restarting */ }
}
async function pollHistory() {
  try {
    renderHistory(await (await fetch('/history')).json());
  } catch (e) { /* ignore */ }
}
async function loadHooks() {
  try {
    const next = await (await fetch('/hooks')).json();
    const sig = JSON.stringify(next);
    if (sig !== hooksSig) {
      hooksSig = sig;
      hooks = next;
      buildStatic();
    }
  } catch (e) { log('tidak bisa memuat /hooks: ' + e, 'bad'); }
}

document.querySelectorAll('[data-ctl]').forEach((b) => (b.onclick = () => control(b.dataset.ctl)));
document.querySelectorAll('[data-ev]').forEach((b) => (b.onclick = () => {
  const t = b.dataset.ev;
  sendEvent(t, t === 'like' ? { count: 10 } : {});
}));
$('sendComment').onclick = () => {
  const text = $('comment').value.trim();
  if (text) { sendEvent('comment', { text }); $('comment').value = ''; }
};
$('comment').onkeydown = (e) => { if (e.key === 'Enter') $('sendComment').click(); };
$('run').onclick = () => {
  const n = $('runName').value;
  if (n) control('run:' + n + (sideKeys.length ? ':' + $('runSide').value : ''));
};

// random viewers: gifts the triggers know, likes, comments
const names = ['Budi', 'Sari', 'Andi', 'Dewi', 'Eko', 'Rina', 'Joko', 'Mira', 'Tono', 'Lia'];
const words = ['semangat!', 'gas terus', 'kubu merah menang', 'hidup rakyat', 'wow', 'lawan!', 'salam dari Bandung'];
let simTimer = null;
function simTick() {
  const gifts = [...new Set((hooks.triggers || []).map(giftName).filter(Boolean))];
  const user = names[Math.floor(Math.random() * names.length)];
  const r = Math.random();
  if (r < 0.45 && gifts.length) post('/webhook', { type: 'gift', gift: gifts[Math.floor(Math.random() * gifts.length)], user, count: 1 + Math.floor(Math.random() * 3), diamonds: 1 }, 'sim gift ' + user);
  else if (r < 0.75) post('/webhook', { type: 'like', user, count: 5 + Math.floor(Math.random() * 20) }, 'sim like ' + user);
  else post('/webhook', { type: 'comment', user, text: words[Math.floor(Math.random() * words.length)] }, 'sim komentar ' + user);
}
function resetSim() {
  clearInterval(simTimer);
  simTimer = null;
  if ($('sim').checked) simTimer = setInterval(simTick, Math.max(300, (+$('simEvery').value || 1.5) * 1000));
}
$('sim').onchange = resetSim;
$('simEvery').onchange = resetSim;

loadHooks();
poll();
pollHistory();
setInterval(poll, 500);
setInterval(pollHistory, 5000);
setInterval(loadHooks, 15000);
</script>
